<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ditto Talking Head - WebRTC Client</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 20px 0;
        }

        .panel {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-weight: 600;
            color: #555;
        }

        input, select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        button {
            padding: 12px 24px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #45a049;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        button.danger {
            background: #f44336;
        }

        button.danger:hover {
            background: #da190b;
        }

        .status {
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
        }

        .status.info {
            background: #e3f2fd;
            color: #1976d2;
        }

        .status.success {
            background: #e8f5e9;
            color: #388e3c;
        }

        .status.error {
            background: #ffebee;
            color: #c62828;
        }

        .stats {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #666;
            margin-top: 10px;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 4px;
        }

        .stats div {
            margin: 3px 0;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <h1>🎭 Ditto Talking Head - WebRTC Client</h1>

    <div class="container">
        <!-- Video Panel -->
        <div class="panel">
            <h2>Avatar Video Stream</h2>
            <div class="video-container">
                <video id="remoteVideo" autoplay playsinline></video>
            </div>
            <div id="stats" class="stats" style="display: none;">
                <div><strong>Connection Stats:</strong></div>
                <div id="connectionState">State: disconnected</div>
                <div id="iceState">ICE: new</div>
                <div id="videoStats">Video: --</div>
                <div id="audioStats">Audio: --</div>
            </div>
        </div>

        <!-- Controls Panel -->
        <div class="panel">
            <h2>Connection Settings</h2>
            <div class="controls">
                <div class="form-group">
                    <label for="serverUrl">WebSocket Server URL</label>
                    <input type="text" id="serverUrl" value="ws://localhost:8080" placeholder="ws://localhost:8080">
                </div>

                <div class="form-group">
                    <label for="avatarSource">Avatar Source Path (on server)</label>
                    <input type="text" id="avatarSource" value="avatars/Hyperrealistic_Indian_Woman_Professional_Presentation_static_5_loop.jpg" placeholder="path/to/avatar.jpg">
                </div>

                <button id="connectBtn" onclick="connect()">Connect to Avatar</button>
                <button id="disconnectBtn" onclick="disconnect()" style="display: none;" class="danger">Disconnect</button>

                <div id="status" class="status info" style="display: none;"></div>

                <hr>

                <h3>Audio Input</h3>
                <div class="form-group">
                    <label for="micSelect">Microphone</label>
                    <select id="micSelect"></select>
                </div>

                <button id="startAudioBtn" onclick="startAudio()" disabled>Start Speaking</button>
                <button id="stopAudioBtn" onclick="stopAudio()" style="display: none;" class="danger">Stop Speaking</button>

                <div id="audioLevel" style="display: none;">
                    <label>Audio Level:</label>
                    <div style="width: 100%; height: 20px; background: #ddd; border-radius: 4px; margin-top: 5px; overflow: hidden;">
                        <div id="audioLevelBar" style="width: 0%; height: 100%; background: #4CAF50; transition: width 0.1s;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
